# Plymouth on top of the systemd initramfs. A drop-in replaces the HOOKS array,
# so this repeats the full order from mkinitcpio.conf with plymouth right after
# systemd: early enough to own the console before sd-encrypt asks for the root
# passphrase, late enough for the systemd units the package ships.
HOOKS=(base systemd plymouth autodetect microcode modconf keyboard sd-vconsole block sd-encrypt lvm2 filesystems fsck)
