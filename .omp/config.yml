tools: 
  approvalMode: write
  approval: 
    bash: allow
    eval: prompt
    task: allow
    hub: allow
    fetch: allow
    web_search: allow
    security_scan: allow
    mcp__codebase_memory_mcp_delete_project: deny
    mcp__codebase_memory_mcp_index_repository: prompt
    mcp__codebase_memory_mcp_ingest_traces: prompt
