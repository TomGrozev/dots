# AGENT-POD OVERLAY — baked into ~/.omp/agent/config.yml by install.sh when
# AGENT_POD=true (see the "Bake the mode's overlay into config.yml" block).
#
# install.sh deep-merges this file OVER .omp/config.yml with
# .omp/merge-config.py, so the config omp loads by default already carries it —
# no PI_CONFIG_FILES, no --config, no env var. It is deep-merged, so this file
# names only the keys it changes; everything else is inherited from the base
# config.
#
# The agent image deliberately ships no omp config overlay of its own: the pod
# gets its entire authored config from the dotfiles clone it runs install.sh
# from, and everything unattended-specific lives here.
#
# Merge rules: objects deep-merge, but arrays and scalars REPLACE wholesale. Every
# array below (skills.includeSkills, disabledProviders, bash.patterns) therefore
# restates the complete list this layer wants, not just its additions.
#
# This profile is the unattended side of the workflow: a Kelos Task pod clones an
# untrusted repository (the PR-review job clones a PR head) and runs omp with no
# human present. Its job is to remove every capability that assumes a human, and
# to keep the cloned repository from reaching into the harness.

# --- No persistent memory, no lesson capture -----------------------------------
# A throwaway pod has no durable store to read or write, and mnemopi/autolearn
# would otherwise try to build one. `memory.backend` is the switch (there is no
# `memory.enabled`); with it off the `mnemopi:` keys in the base config are inert.
#
# `"off"` is quoted on purpose: omp compares this value to the string "off", but
# PyYAML (the YAML 1.1 reader .omp/merge-config.py uses) reads a bare `off` as
# boolean false, which would silently leave the backend enabled after the bake.
memory:
  backend: "off"
autolearn:
  enabled: false

# --- Model roles ---------------------------------------------------------------
# Only the four roles the base config points at anthropic/claude-opus-5-5 are
# remapped off Anthropic: those models are unavailable in the pod (no Anthropic
# credential, and the discovery providers are disabled below).
#
# Every NeuralWatt id the pod uses is the `-flex` variant. A flex model has the
# same weights, context window and output cap as the standard id, and is
# admitted on spare capacity at a discounted price. That is the right tier for
# work that runs unattended in the background. The discount applies to streaming
# requests only, and omp always streams.
#
# The base config's NeuralWatt ids are restated here because the overlay
# deep-merges: an unnamed role keeps the base config's non-flex id. `memory` is
# already flex in the base config, so it is not repeated. Two NeuralWatt models
# have no flex variant and stay inherited: `gemma-4-31b` (vision, and the tiny
# and commit fallback) and `clef-flash` (the judge classifier).
modelRoles:
  slow: neuralwatt/mimo-v2.6-pro-flex:auto
  plan: neuralwatt/mimo-v2.6-pro-flex:auto
  review: neuralwatt/mimo-v2.6-pro-flex:auto
  designer: neuralwatt/glm-5.3-flex:auto
  task: neuralwatt/deepseek-v4.1-flash-flex:auto
  smol: neuralwatt/deepseek-v4.1-flash-flex:low
  tiny: neuralwatt/qwen3.6-35b-flex:off
  writer: neuralwatt/glm-5.3-flash-flex:low
  commit: neuralwatt/qwen3.6-35b-flex:off
  advisor: neuralwatt/glm-5.3-flash-flex:low
  default: neuralwatt/deepseek-v4.1-flash-flex:auto

# --- Fallback chains -----------------------------------------------------------
# The same flex rule applies to the inherited retry chains. Each named chain
# replaces the base chain wholesale (arrays are not merged), so every chain that
# names a NeuralWatt id is restated in full. `tiny`, `commit` and `judge` keep
# their inherited chains: they name `gemma-4-31b` and `@tiny`, which have no
# flex variant.
retry:
  fallbackChains:
    default:
      - neuralwatt/glm-5.3-flash-flex:high
      - neuralwatt/mimo-v2.6-pro-flex:auto
    slow:
      - neuralwatt/mimo-v2.6-pro-flex:high
      - neuralwatt/glm-5.3-flex:high
    plan:
      - neuralwatt/mimo-v2.6-pro-flex:high
      - neuralwatt/glm-5.3-flex:high
    task:
      - neuralwatt/glm-5.3-flash-flex:high
      - neuralwatt/mimo-v2.6-pro-flex:auto
    smol:
      - neuralwatt/glm-5.3-flash-flex:low
      - neuralwatt/qwen3.6-35b-flex:high
    writer:
      - neuralwatt/deepseek-v4.1-flash-flex:low
    review:
      - neuralwatt/mimo-v2.6-pro-flex:high
      - neuralwatt/glm-5.3-flex:high
    designer:
      - neuralwatt/mimo-v2.6-pro-flex:high
      - neuralwatt/glm-5.3-flex:high
    advisor:
      - neuralwatt/deepseek-v4.1-flash-flex:low
    vision:
      - neuralwatt/qwen-3.8-27b-flex:low

# --- Skills allowlist ----------------------------------------------------------
# includeSkills is an allowlist of glob patterns applied to the FINAL listing
# (after name resolution), and enablePiProject gates the native provider's
# project skills. Both matter here: the workspace is a cloned untrusted repo, and
# without enablePiProject: false it could ship a `.omp/skills/<name>/SKILL.md`
# that shadows one of the names below and runs with this pod's authority.
skills:
  includeSkills:
    - implement
    - tdd
    - code-review
    - walkthrough
    - land
    - conventional-commit
    - frontend-design
    - apple-design
  enablePiProject: false

# --- Discovery providers -------------------------------------------------------
# disabledProviders is a single shared id namespace covering model providers and
# discovery sources, and this array replaces the base config's wholesale — hence
# the five entries it already carried, restated.
#
# The five appended ids are discovery sources, not model providers: `claude`,
# `codex`, `gemini`, `github` and `agents` (the `.agent[s]` root). When the
# workspace is an untrusted repository — the PR-review job clones a PR head —
# everything those providers contribute (skills, MCP servers, hooks, commands,
# context files, settings) is attacker-controlled, so none of them may load.
disabledProviders:
  - opencode
  - opencode-go
  - ollama
  - llama.cpp
  - lm-studio
  - claude
  - codex
  - gemini
  - github
  - agents

# --- ask -----------------------------------------------------------------------
# `0` (the default) means an unattended `ask` call never returns: the session
# blocks on a dialog nobody can answer. 120s lets the recommendation be taken and
# the run continue.
ask:
  timeout: 120

# --- Tools and approvals -------------------------------------------------------
# approvalMode: yolo is required for an unattended run — the base config pins
# `write`, which stalls on anything outside workspace-write, and a stalled tool
# call is a hung pod.
#
# Only commit_as_me is named here: tools.approval is a record, so it deep-merges
# with the base config's per-tool entries and the rest are inherited. That tool's
# dialog IS its gate (the human picks the identity), so it can never succeed
# headless; under yolo a `prompt` policy would also fail closed with no
# interactive UI, but `deny` states the intent.
tools:
  approvalMode: yolo
  approval:
    commit_as_me: deny

# --- bash command policy -------------------------------------------------------
# Copied verbatim from ~/.omp/config-devcontainer.yml, the existing delta-overlay
# precedent, because approvalMode: yolo bypasses omp's built-in critical-command
# guard (recursive root deletes, fork bombs, host shutdown, ...). Those
# catastrophic-command denies are therefore restated explicitly rather than
# inherited, with a leading `*` so that wrapper prefixes (`rtk`, `sudo`, `time`,
# ...) cannot rewrite the command out from under the pattern. The
# credential-material denies are absolute and carry no override. The trailing
# blanket `allow` is required because arrays replace wholesale: the list must
# state its own complete policy rather than rely on a lower layer's.
bash:
  patterns:
    # --- Credential material: deny, everywhere, no override ---
    - match: "*.ssh/*"
      approval: deny
    - match: "*id_rsa*"
      approval: deny
    - match: "*id_ed25519*"
      approval: deny
    - match: "*.gnupg*"
      approval: deny
    - match: "*.aws/*"
      approval: deny
    - match: "*.kube/config*"
      approval: deny
    - match: "*.docker/config.json*"
      approval: deny
    - match: "*gcloud/*"
      approval: deny
    - match: "*credentials*"
      approval: deny
    - match: "*auth.json*"
      approval: deny
    - match: "*gh/hosts.yml*"
      approval: deny
    - match: "*.password-store*"
      approval: deny
    - match: "*Keychains*"
      approval: deny
    - match: "*.netrc*"
      approval: deny
    - match: "*.git-credentials*"
      approval: deny
    - match: "*.npmrc*"
      approval: deny
    - match: "*.pypirc*"
      approval: deny
    - match: "*.pem*"
      approval: deny
    - match: "*.p12*"
      approval: deny
    - match: "*.pfx*"
      approval: deny
    - match: "*terraform.tfstate*"
      approval: deny
    - match: "security find-generic-password*"
      approval: deny
    - match: "security dump-keychain*"
      approval: deny
    # --- Catastrophic commands: yolo bypasses omp's critical guard, restated here ---
    - match: "*rm -rf /"
      approval: deny
    - match: "*rm -fr /"
      approval: deny
    - match: "*rm -rf /*"
      approval: deny
    - match: "*rm -fr /*"
      approval: deny
    - match: "*rm -rf --no-preserve-root*"
      approval: deny
    - match: "*rm -rf ~"
      approval: deny
    - match: "*rm -rf $HOME"
      approval: deny
    - match: "mkfs*"
      approval: deny
    - match: "*dd if=* of=/dev/*"
      approval: deny
    - match: "diskutil erase*"
      approval: deny
    - match: "diskutil partitionDisk*"
      approval: deny
    - match: "shutdown*"
      approval: deny
    - match: "reboot*"
      approval: deny
    - match: "halt*"
      approval: deny
    - match: ":(){*"
      approval: deny
    # --- Fallback: everything else in the box just runs ---
    - match: "*"
      approval: allow
