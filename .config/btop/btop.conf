# Curated btop config for the Polar Hyprland desktop. Kept deliberately small:
# anything not listed here keeps btop's built-in default.

# Resolves in this config's own themes/ directory, not the system theme dir.
color_theme = "nord"

# Transparent so ghostty's glass shows through.
theme_background = false
truecolor = true
rounded_corners = true

# h/j/k/l/g/G navigation, matching vim-style panes elsewhere on the desktop.
vim_keys = true

update_ms = 1000
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_gpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

shown_boxes = "cpu mem net proc"

proc_sorting = "cpu lazy"
proc_tree = false
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true

mem_graphs = true
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = true
zfs_arc_cached = true

net_auto = true
net_sync = true
net_download = 100
net_upload = 100

show_gpu_info = "Auto"
show_battery = false
background_update = false
base_10_sizes = false
io_mode = false
show_io_stat = true

# This config is symlinked into the dotfiles repo; letting btop save on exit
# would rewrite the link target with its full autogenerated config.
save_config_on_exit = false
