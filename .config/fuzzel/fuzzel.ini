# Polar launcher / cheat sheet: Nord, centred, 8px corners.
# Width is in characters and serves both the app launcher and the cheat sheet
# (`polar-cheatsheet` runs fuzzel in dmenu mode over a ~80-column TSV).
[main]
font=FiraCode Nerd Font:size=12
dpi-aware=no
prompt=❯ 
placeholder=Search
icons-enabled=yes
icon-theme=Papirus-Dark
terminal=ghostty -e
anchor=center
width=80
lines=20
horizontal-pad=16
vertical-pad=14
inner-pad=6
layer=overlay
namespace=launcher
match-mode=fzf

[border]
width=2
radius=8
selection-radius=4

[colors]
background=2e3440f2
text=d8dee9ff
message=d8dee9ff
prompt=88c0d0ff
placeholder=4c566aff
input=eceff4ff
match=88c0d0ff
selection=434c5eff
selection-text=eceff4ff
selection-match=8fbcbbff
counter=4c566aff
border=88c0d0ff
