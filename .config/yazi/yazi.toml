[manager]
show_hidden = true
sort_by      = "alphabetical"
sort_dir_first = true
sort_sensitive  = false
linemode         = "size"

[preview]
tab_size   = 2
max_width  = 800
max_height = 900

[opener]
# yazi's [open] rules send text to `edit`, images to `open` and media to `play`.
# All three route through polar-open, which hides the files drop-down before a
# new window appears; without that the window stays behind the overlay.
edit = [
  { run = 'polar-open --edit %s', desc = "Neovim", block = true },
]
open = [
  { run = 'polar-open %s', desc = "Open" },
]
play = [
  { run = 'polar-open %s', desc = "Play" },
]

[tasks]
micro_workers   = 5
macro_workers   = 10
bizarre_retry   = 5
