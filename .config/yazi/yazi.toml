[manager]
show_hidden = true
sort_by      = "alphabetical"
sort_dir_first = true
sort_sensitive  = false
linemode         = "size"

[preview]
tab_size   = 2
max_width  = 800
max_height = 900

[opener]
edit = [
  { run = 'nvim "$@"', block = true },
]

[tasks]
micro_workers   = 5
macro_workers   = 10
bizarre_retry   = 5
