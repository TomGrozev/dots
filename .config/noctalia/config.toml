# Polar's Noctalia shell: one top bar, desktop widgets, Nord palette.
# This file is the repo base. The settings window writes runtime overrides to
# ~/.local/state/noctalia/settings.toml, which loads last and wins.

[shell]
time_format = "{:%H:%M}"
date_format = "%a %d %b"
clipboard_enabled = true
clipboard_history_max_entries = 100
# Noctalia claims the selection when the copying app exits, which is what
# wl-clip-persist used to do. Password managers are excluded by the shell.
clipboard_keep_from_closed_apps = true
clipboard_auto_paste = "auto"

[theme]
mode = "dark"
source = "builtin"
builtin = "Nord"

# The Qt template writes ~/.config/qt6ct/colors/noctalia.conf. install.sh points
# qt6ct at that colour scheme when the user has not chosen one already.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["qt"]

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/.local/share/polar/wallpapers"
transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb", "vortex", "pixel", "diamond", "golden", "melt", "crt"]
transition_duration = 900
edge_smoothness = 0.3
transition_on_startup = true
sync_transitions = true

[wallpaper.default]
path = "~/.local/share/polar/wallpapers/signal-terrain.png"

[wallpaper.automation]
enabled = false
interval_seconds = 1800
order = "random"

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
keep_dismissed_in_history = true
group_by_app = true
layer = "overlay"
background_opacity = 0.96
border = true
border_color = "primary"
border_width = 1
offset_x = 12
offset_y = 8

[osd]
position = "top_center"
hide_delay_ms = 1400
background_opacity = 0.96
border = true
border_color = "primary"
border_width = 1
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
keyboard_layout = true
privacy = true

[audio]
enable_sounds = true
enable_volume_sounds = true
enable_notification_sounds = true
enable_screenshot_sounds = true
sound_volume = 0.5
sound_theme = "freedesktop"

[lockscreen]
enabled = true
blurred_desktop = true
transition = ["fade"]
transition_duration = 700
blur_intensity = 0.5
tint_intensity = 0.3
tint_color = "surface"

# Blank at 5 min, lock at 10, and switch the panel off at 11 so the lock screen
# has drawn before the output goes dark.
[idle]
behavior_order = ["screen-off", "lock", "screen-off-after-lock"]
pre_action_fade_seconds = 0

[idle.behavior.screen-off]
timeout = 300
action = "screen_off"
enabled = true

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off-after-lock]
timeout = 660
action = "screen_off"
enabled = true

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0

[hooks]
# Lock and unlock feedback through PipeWire, independent of the shell's own
# UI sounds. Hyphenated paths are passed to pw-play as one argument.
session_locked = ["pw-play /usr/share/sounds/freedesktop/stereo/service-logout.oga"]
session_unlocked = ["pw-play /usr/share/sounds/freedesktop/stereo/service-login.oga"]

# Catalog plugins come from the official and community sources that ship with
# Noctalia. Do not add a [[plugins.source]] here: declaring one replaces the
# built-in list, and every catalog plugin then fails to load.
[plugins]
enabled = [
  # Official
  "noctalia/bitwarden",
  "noctalia/notes",
  "noctalia/world_clock",
  "noctalia/screen_recorder",
  "noctalia/wallpaper_depth",
  # Bar
  "k4n4t4/hypr-submap",
  "83raiders/scroll-indicator",
  "gcap0n1/f1",
  "jrohland/claudecode",
  "omertahaoztop/neuralwatt",
  "yuuto/arch-updater",
  "mahmoudomiesh/network-monitor",
  "3ri4ng0ld/ip-monitor",
  # Panels and desktop
  "yahya637/process-monitor",
  "alexander/screen-toolkit",
  "soulmanyes/workspace-restore",
  "nirusaki/clearclock",
  "darulqutni-q/github-contributions-desktop",
]
auto_update = "official"

# One row per app rather than per process.
[plugin_settings."yahya637/process-monitor"]
group_by_app = true

# The recorder's bar widget appears only while a recording runs.
[plugin_settings."noctalia/screen_recorder"]
hide_inactive = true

# Built-in sysmon widgets show the speed; this plugin adds only the
# listening-ports list and its stop/open actions.
[plugin_settings."mahmoudomiesh/network-monitor"]
show_speed = false

# Same colour language as the Claude pill beside it: neutral text normally,
# tertiary when high, error when nearly spent.
[plugin_settings."omertahaoztop/neuralwatt"]
ok_color = "on_surface"
warn_color = "tertiary"

# Night light: warm from 20:30 to 07:00. The custom
# schedule ignores coordinates, so no location has to be stored here.
[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4500

[location]
custom_schedule = true
sunset = "20:30"
sunrise = "07:00"

[bar.main]
position = "top"
layer = "top"
thickness = 34
background_opacity = 0.9
compositor_blur = true
border = "outline_variant"
border_width = 1
shadow = true
radius = 17
margin_ends = 48
margin_edge = 8
padding = 14
widget_spacing = 8
reserve_space = true
auto_hide = false
# margin_ends insets the strip from the screen edges; capsule = false keeps
# every widget flat, without a pill background of its own.
capsule = false
# No centre section: Noctalia does not push a centred section aside, so with
# this many plugin widgets on the right the two overlapped. `center` must stay
# an explicit empty list; leaving it out brings back the default clock.
start = ["launcher", "workspaces", "submap", "scroll", "media", "visualizer"]
center = []
end = [
  "f1",
  "recorder",
  "group:ai",
  "updates",
  "cpu",
  "ram",
  "group:net",
  "tray",
  "bluetooth",
  "volume",
  "notifications",
  "clock",
  "session",
]

# Accordion groups fold to their first widget and unfold on hover, which keeps
# the right end short. Opacity 0 keeps them flat like the rest of the bar.
# The ai group is not an accordion: the Claude 5-hour and Neuralwatt plan
# percentages sit side by side, each behind its own icon (the Neuralwatt
# plugin hard-codes its logo).
[[bar.main.capsule_group]]
id = "ai"
members = ["claude", "neuralwatt"]
opacity = 0.0
padding = 0.0
widget_spacing = 4

[[bar.main.capsule_group]]
id = "net"
members = ["net-down", "net-up", "ports", "lan-ip"]
opacity = 0.0
padding = 0.0
accordion = true

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "id"
hide_when_empty = false
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_container"
urgent_color = "error"
active_pill_size = 2.2
inactive_pill_size = 1.0

[widget.clock]
format = "{:%H:%M}"
tooltip_format = "%A, %B %d, %Y"

[widget.media]
hide_when_no_media = true
max_length = 220

# Built-in spectrum beside the track; hidden while nothing plays.
[widget.visualizer]
type = "audio_visualizer"
width = 56
bands = 14
show_wave = true
color_1 = "primary"
color_2 = "secondary"

# Hyprland submap (resize mode) name; hidden outside a mode.
[widget.submap]
type = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true

# Column dots for workspace 9, the scrolling-layout workspace.
[widget.scroll]
type = "83raiders/scroll-indicator:dots"

[widget.f1]
type = "gcap0n1/f1:bar"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.claude]
type = "jrohland/claudecode:pill"

[widget.neuralwatt]
type = "omertahaoztop/neuralwatt:bar"
bar_mode = "percent"

[widget.updates]
type = "yuuto/arch-updater:widget"

[widget.ports]
type = "mahmoudomiesh/network-monitor:indicator"

# LAN address of the wired interface; click copies it.
[widget.lan-ip]
type = "3ri4ng0ld/ip-monitor:widget"
iface = "en*"

# CPU and RAM open the per-app process panel. Text only: a graph or gauge
# doubles their width.
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
glyph = "cpu"
label_min_width = 30

[widget.cpu.actions]
left = "panel-toggle yahya637/process-monitor:panel"

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
glyph = "stack-2"
label_min_width = 30

[widget.ram.actions]
left = "panel-toggle yahya637/process-monitor:panel"

[widget.net-down]
type = "sysmon"
stat = "net_rx"
visualization = "none"
network_speed_compact = true
network_speed_decimal_places = 0

[widget.net-up]
type = "sysmon"
stat = "net_tx"
visualization = "none"
network_speed_compact = true
network_speed_decimal_places = 0

# One tray glyph that opens the icons, instead of every icon inline.
[widget.tray]
drawer = true

[widget.bluetooth]
show_label = false

[widget.volume]
show_label = true
hide_label_when_muted = false

[widget.notifications]
hide_when_no_unread = false

# The desktop shows only on an empty workspace: ClearClock with its digits
# filled from the wallpaper beneath them, and the GitHub contribution year
# under it. wallpaper_depth masks the wallpaper's foreground over both once
# its model is installed from its panel. Positions are logical pixels on the
# 1920x1080 monitor; the editor (noctalia msg desktop-widgets-toggle-edit)
# writes moves to settings.toml.
[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["clock", "github"]

[desktop_widgets.widget.clock]
type = "nirusaki/clearclock:desktop"
output = "HDMI-A-1"
cx = 960.0
cy = 420.0

[desktop_widgets.widget.clock.settings]
frostedFont = true

[desktop_widgets.widget.github]
type = "darulqutni-q/github-contributions-desktop:calendar"
output = "HDMI-A-1"
cx = 960.0
cy = 860.0

[desktop_widgets.widget.github.settings]
cell_size = 12
corner_radius = 3
