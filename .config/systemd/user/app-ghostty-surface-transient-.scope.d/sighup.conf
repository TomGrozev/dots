# Ghostty runs each terminal surface in its own transient scope. On logout or
# shutdown systemd stops the scope with SIGTERM, but interactive zsh ignores
# SIGTERM and the zellij server traps it without exiting, so every shutdown sat
# on a dark screen for the full 90 s stop timeout before SIGKILL. SIGHUP is the
# "your terminal is gone" signal, and both exit on it.
[Scope]
SendSIGHUP=yes
