# Polar idle policy: blank at 5 min, lock at 10, screen off at 11.
# A desktop (single HDMI panel, no backlight control) cannot dim in software,
# so the 5-minute step blanks the display with DPMS; on-resume brings it back.
# No suspend listener: this machine is a desktop and stays awake.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min — dim/blank the screen.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min — lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
    on-resume = hyprctl dispatch dpms on
}

# 11 min — screen fully off after the lock has had time to draw.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
}
