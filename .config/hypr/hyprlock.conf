# Polar lock screen: blurred desktop, big clock, Nord input field.
# Hyprlock renders the last frame itself (`path = screenshot`), so the lock
# never flashes an old wallpaper.

# --- Background -------------------------------------------------------------

background {
    monitor =
    path = screenshot
    color = rgb(46, 52, 64)
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# --- Clock + date -----------------------------------------------------------

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(236, 239, 244)
    font_family = FiraCode Nerd Font
    font_size = 140
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(136, 192, 208)
    font_family = FiraCode Nerd Font
    font_size = 18
    position = 0, 95
    halign = center
    valign = center
}

# --- Password ---------------------------------------------------------------

input-field {
    monitor =
    size = 320, 46
    position = 0, -60
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 8
    outer_color = rgb(136, 192, 208)
    inner_color = rgb(46, 52, 64)
    font_color = rgb(236, 239, 244)
    font_family = FiraCode Nerd Font

    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    # hyprlang treats '#' as a comment start; '##' is the escaped literal '#'.
    placeholder_text = <span foreground="##4c566a">Password…</span>
    hide_input = false

    check_color = rgb(235, 203, 139)
    fail_color = rgb(191, 97, 106)
    fail_text = <i>$FAIL</i>
    capslock_color = rgb(235, 203, 139)
}

# Hint for a user who is new to the lock screen.
label {
    monitor =
    text = Enter your password · Esc clears the field
    color = rgb(76, 86, 106)
    font_family = FiraCode Nerd Font
    font_size = 12
    position = 0, -110
    halign = center
    valign = center
}
