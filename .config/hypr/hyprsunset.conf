# Night light: hyprsunset colour-temperature profiles.
# hyprsunset applies the last profile whose time has passed and holds it until
# the next one, so the 20:30 warm profile survives midnight and the 07:00
# identity profile ends it. Times are local wall-clock time.
# (Schema: hyprwm/hyprsunset v0.4.0 src/ConfigManager.cpp -- profile keys are
# time, temperature, gamma, identity; no on-switch before 0.5.)

max-gamma = 100

profile {
    time = 07:00
    identity = true
}

profile {
    time = 20:30
    temperature = 4500
    gamma = 1.0
}
